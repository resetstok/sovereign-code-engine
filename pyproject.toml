[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-code-engine"
version = "2.0.0"
description = "PCI Master System v2.0 - Sovereign Code Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "resetstok", email = "resetstokworld@gmail.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "customtkinter>=5.2.0",
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0"
]

[project.scripts]
pci-engine = "pci_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
